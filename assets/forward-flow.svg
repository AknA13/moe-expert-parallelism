<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
  <title id="title">Forward pass on both ranks</title>
  <desc id="desc">A four-expert example. Rank 0 owns E0 and E1; rank 1 owns E2 and E3. Token A on rank 0 uses local E0 and remote E2. Token B on rank 1 uses local E3 and remote E1. Both ranks exchange routing metadata, projected token rows, and expert results before locally combining their outputs.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526176" stroke-width="1.8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2b8a57" stroke-width="1.8"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#c8713e" stroke-width="1.8"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c4caf" stroke-width="1.8"/></marker>
    <symbol id="expert" viewBox="0 0 76 68">
      <g fill="none" stroke="#87a9a2" stroke-width="1.5"><path d="M8 17L37 9M8 17L37 34M8 17L37 59M8 51L37 9M8 51L37 34M8 51L37 59M37 9L68 17M37 9L68 51M37 34L68 17M37 34L68 51M37 59L68 17M37 59L68 51"/></g>
      <g fill="#c9ebe2" stroke="#21836e" stroke-width="1.8"><circle cx="8" cy="17" r="5"/><circle cx="8" cy="51" r="5"/><circle cx="37" cy="9" r="5"/><circle cx="37" cy="34" r="5"/><circle cx="37" cy="59" r="5"/><circle cx="68" cy="17" r="5"/><circle cx="68" cy="51" r="5"/></g>
    </symbol>
  </defs>

  <rect width="1440" height="1240" fill="#fff"/>
  <text x="40" y="46" fill="#202a3a" font-family="system-ui,sans-serif" font-size="29" font-weight="700">Forward pass · both ranks</text>
  <text x="40" y="78" fill="#5c6a7e" font-family="system-ui,sans-serif" font-size="17">Green follows token A; orange follows token B. Each token chooses one local and one remote expert.</text>
  <rect x="40" y="105" width="650" height="1100" rx="18" fill="#f7faff" stroke="#d6e1ee" stroke-width="2"/>
  <rect x="750" y="105" width="650" height="1100" rx="18" fill="#f8fbfa" stroke="#d7e7e2" stroke-width="2"/>
  <text x="68" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 0 · experts E0, E1</text>
  <text x="778" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 1 · experts E2, E3</text>

  <!-- Each rank projects and routes its own source token. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <circle cx="365" cy="215" r="40" fill="#e8f6eb" stroke="#2b8a57" stroke-width="2.5"/>
    <text x="365" y="211" fill="#2b8a57" font-size="15" font-weight="700">token A</text>
    <text x="365" y="230" fill="#2b8a57" font-size="15" font-weight="700">emb.</text>
    <circle cx="1075" cy="215" r="40" fill="#fff0e6" stroke="#c8713e" stroke-width="2.5"/>
    <text x="1075" y="211" fill="#a25122" font-size="15" font-weight="700">token B</text>
    <text x="1075" y="230" fill="#a25122" font-size="15" font-weight="700">emb.</text>
    <rect x="280" y="275" width="170" height="48" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="365" y="305" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <rect x="990" y="275" width="170" height="48" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="1075" y="305" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <rect x="280" y="343" width="170" height="48" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="365" y="373" fill="#684496" font-size="18" font-weight="700">Routing layer</text>
    <rect x="990" y="343" width="170" height="48" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="1075" y="373" fill="#684496" font-size="18" font-weight="700">Routing layer</text>
  </g>
  <g fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#gray-arrow)">
    <path d="M365 255V274M365 323V342M1075 255V274M1075 323V342"/>
  </g>

  <!-- Each horizontal rule is a collective across the two ranks. -->
  <g fill="none" stroke="#8492a3" stroke-width="2.5">
    <path d="M155 462H1285M155 518H1285"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#526176" font-size="17" font-weight="700">
    <rect x="595" y="439" width="250" height="29" fill="#fff"/>
    <text x="720" y="459">C1 · exchange counts</text>
    <rect x="591" y="495" width="258" height="29" fill="#fff"/>
    <text x="720" y="515">C2 · exchange expert IDs</text>
  </g>

  <!-- C3: the projected rows cross one all-to-all stage, then fan into owner experts. -->
  <path d="M365 392V602M1075 392V602" fill="none" stroke="#8995a5" stroke-width="2.5" stroke-dasharray="5 6"/>
  <path d="M155 610H1285" fill="none" stroke="#526176" stroke-width="4"/>
  <rect x="450" y="580" width="540" height="30" fill="#fff"/>
  <text x="720" y="602" text-anchor="middle" fill="#202a3a" font-family="system-ui,sans-serif" font-size="18" font-weight="700">C3 · dispatch expert inputs to ranks</text>
  <g fill="none" stroke-width="3" marker-end="url(#green-arrow)">
    <path d="M340 610V700" stroke="#2b8a57"/>
    <path d="M900 610V700" stroke="#2b8a57"/>
  </g>
  <g fill="none" stroke-width="3" marker-end="url(#orange-arrow)">
    <path d="M540 610V700" stroke="#c8713e"/>
    <path d="M1100 610V700" stroke="#c8713e"/>
  </g>

  <!-- Owner-side expert computation uses neural-network glyphs. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="280" y="748" fill="#176d5a" font-size="19" font-weight="700">E0</text>
    <text x="480" y="748" fill="#176d5a" font-size="19" font-weight="700">E1</text>
    <text x="962" y="748" fill="#176d5a" font-size="19" font-weight="700">E2</text>
    <text x="1162" y="748" fill="#176d5a" font-size="19" font-weight="700">E3</text>
    <use xlink:href="#expert" x="302" y="705" width="76" height="68"/>
    <use xlink:href="#expert" x="502" y="705" width="76" height="68"/>
    <use xlink:href="#expert" x="862" y="705" width="76" height="68"/>
    <use xlink:href="#expert" x="1062" y="705" width="76" height="68"/>
  </g>

  <!-- C4 returns all expert outputs; green goes to A and orange goes to B. -->
  <g fill="none" stroke-width="3" marker-end="url(#green-arrow)">
    <path d="M340 773V895" stroke="#2b8a57"/>
    <path d="M900 773V895" stroke="#2b8a57"/>
  </g>
  <g fill="none" stroke-width="3" marker-end="url(#orange-arrow)">
    <path d="M540 773V895" stroke="#c8713e"/>
    <path d="M1100 773V895" stroke="#c8713e"/>
  </g>
  <path d="M155 905H1285" fill="none" stroke="#526176" stroke-width="4"/>
  <rect x="557" y="875" width="326" height="30" fill="#fff"/>
  <text x="720" y="897" text-anchor="middle" fill="#202a3a" font-family="system-ui,sans-serif" font-size="18" font-weight="700">C4 · return expert outputs</text>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M320 905V1008H365V1042" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M440 905V1080H403" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M1000 905V1080H1037" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
    <path d="M1120 905V1008H1075V1042" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="700">
    <text x="219" y="977" fill="#2b8a57">E0 output</text>
    <text x="455" y="977" fill="#2b8a57">E2 output</text>
    <text x="804" y="977" fill="#b35d2e">E1 output</text>
    <text x="1137" y="977" fill="#b35d2e">E3 output</text>
  </g>

  <!-- Selected router weights stay on their source ranks for combination. -->
  <path d="M280 367H135V1080H327M1160 367H1305V1080H1113" fill="none" stroke="#7c4caf" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#purple-arrow)"/>
  <text x="118" y="784" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(-90 118 784)">A's expert weights</text>
  <text x="1325" y="784" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(90 1325 784)">B's expert weights</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <circle cx="365" cy="1080" r="36" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/><text x="365" y="1090" fill="#684496" font-size="28" font-weight="700">Σ</text>
    <circle cx="1075" cy="1080" r="36" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/><text x="1075" y="1090" fill="#684496" font-size="28" font-weight="700">Σ</text>
    <text x="365" y="1145" fill="#202a3a" font-size="19" font-weight="700">weighted sum → prediction A → loss A</text>
    <text x="1075" y="1145" fill="#202a3a" font-size="19" font-weight="700">weighted sum → prediction B → loss B</text>
  </g>
</svg>
