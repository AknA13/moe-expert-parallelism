<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1360" role="img" aria-labelledby="title desc">
  <title id="title">Backward pass on both ranks</title>
  <desc id="desc">Gradients flow from the new token embeddings through weighted combination, expert-output exchange, owner-side expert backward, expert-input exchange, routing and projection backward, and finally to the original token embeddings. Expert parameter gradients stay on owner ranks; replicated parameter gradients are all-reduced.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526176" stroke-width="1.8"/></marker>
    <marker id="two-way" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c4caf" stroke-width="1.8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2b8a57" stroke-width="1.8"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#c8713e" stroke-width="1.8"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c4caf" stroke-width="1.8"/></marker>
    <symbol id="expert" viewBox="0 0 76 68">
      <g fill="none" stroke="#87a9a2" stroke-width="1.5"><path d="M8 17L37 9M8 17L37 34M8 17L37 59M8 51L37 9M8 51L37 34M8 51L37 59M37 9L68 17M37 9L68 51M37 34L68 17M37 34L68 51M37 59L68 17M37 59L68 51"/></g>
      <g fill="#c9ebe2" stroke="#21836e" stroke-width="1.8"><circle cx="8" cy="17" r="5"/><circle cx="8" cy="51" r="5"/><circle cx="37" cy="9" r="5"/><circle cx="37" cy="34" r="5"/><circle cx="37" cy="59" r="5"/><circle cx="68" cy="17" r="5"/><circle cx="68" cy="51" r="5"/></g>
    </symbol>
  </defs>

  <rect width="1440" height="1360" fill="#fff"/>
  <text x="40" y="46" fill="#202a3a" font-family="system-ui,sans-serif" font-size="29" font-weight="700">Backward pass · both ranks</text>
  <text x="40" y="78" fill="#5c6a7e" font-family="system-ui,sans-serif" font-size="17">Gradients flow from new embeddings to original embeddings. Expert gradients stay on owners; shared gradients are summed.</text>
  <rect x="40" y="105" width="650" height="1220" rx="18" fill="#f7faff" stroke="#d6e1ee" stroke-width="2"/>
  <rect x="750" y="105" width="650" height="1220" rx="18" fill="#f8fbfa" stroke="#d7e7e2" stroke-width="2"/>
  <text x="68" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 0 · experts E0, E1</text>
  <text x="778" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 1 · experts E2, E3</text>

  <!-- The incoming gradient passes through the weighted expert combination. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <circle cx="365" cy="215" r="46" fill="#e8f6eb" stroke="#2b8a57" stroke-width="2.5"/>
    <text x="365" y="210" fill="#2b8a57" font-size="13" font-weight="700">new token A</text>
    <text x="365" y="229" fill="#2b8a57" font-size="15" font-weight="700">emb.</text>
    <circle cx="1075" cy="215" r="46" fill="#fff0e6" stroke="#c8713e" stroke-width="2.5"/>
    <text x="1075" y="210" fill="#a25122" font-size="13" font-weight="700">new token B</text>
    <text x="1075" y="229" fill="#a25122" font-size="15" font-weight="700">emb.</text>
    <rect x="285" y="282" width="160" height="52" rx="11" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="365" y="314" fill="#684496" font-size="19" font-weight="700">weighted Σ</text>
    <rect x="995" y="282" width="160" height="52" rx="11" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="1075" y="314" fill="#684496" font-size="19" font-weight="700">weighted Σ</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M365 261V281" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M1075 261V281" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>
  <text x="720" y="390" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">Counts and expert IDs have no backward path.</text>

  <!-- B1 exchanges expert-output gradients, including self-splits. -->
  <path d="M365 335V451M1075 335V451" fill="none" stroke="#8995a5" stroke-width="2.5" stroke-dasharray="5 6"/>
  <path d="M155 460H1285" fill="none" stroke="#526176" stroke-width="4"/>
  <rect x="449" y="430" width="542" height="30" fill="#fff"/>
  <text x="720" y="452" text-anchor="middle" fill="#202a3a" font-family="system-ui,sans-serif" font-size="18" font-weight="700">B1 · send expert-output gradients to owners</text>
  <g fill="none" stroke-width="3" marker-end="url(#green-arrow)">
    <path d="M340 460V580" stroke="#2b8a57"/>
    <path d="M900 460V580" stroke="#2b8a57"/>
  </g>
  <g fill="none" stroke-width="3" marker-end="url(#orange-arrow)">
    <path d="M540 460V580" stroke="#c8713e"/>
    <path d="M1100 460V580" stroke="#c8713e"/>
  </g>

  <!-- Each expert backpropagates on its owner rank. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="280" y="628" fill="#176d5a" font-size="19" font-weight="700">E0</text>
    <text x="480" y="628" fill="#176d5a" font-size="19" font-weight="700">E1</text>
    <text x="962" y="628" fill="#176d5a" font-size="19" font-weight="700">E2</text>
    <text x="1162" y="628" fill="#176d5a" font-size="19" font-weight="700">E3</text>
    <use xlink:href="#expert" x="302" y="585" width="76" height="68"/>
    <use xlink:href="#expert" x="502" y="585" width="76" height="68"/>
    <use xlink:href="#expert" x="862" y="585" width="76" height="68"/>
    <use xlink:href="#expert" x="1062" y="585" width="76" height="68"/>
  </g>

  <!-- B2 returns expert-input gradients to the tokens' original ranks. -->
  <g fill="none" stroke-width="3">
    <path d="M340 653V775" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M900 653V775" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M540 653V775" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
    <path d="M1100 653V775" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>
  <path d="M155 785H1285" fill="none" stroke="#526176" stroke-width="4"/>
  <text x="720" y="821" text-anchor="middle" fill="#202a3a" font-family="system-ui,sans-serif" font-size="18" font-weight="700">B2 · return expert-input gradients</text>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M320 785V939" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M470 785V970H445" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M970 785V970H995" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
    <path d="M1120 785V939" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>

  <!-- The expert path and the router path meet before projection backward. -->
  <path d="M285 308H105V970H120M1155 308H1335V970H1320" fill="none" stroke="#7c4caf" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#purple-arrow)"/>
  <text x="74" y="690" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(-90 74 690)">expert-weight gradient</text>
  <text x="1370" y="690" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(90 1370 690)">expert-weight gradient</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="120" y="942" width="140" height="56" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="190" y="976" fill="#684496" font-size="16" font-weight="700">Routing layer</text>
    <rect x="1180" y="942" width="140" height="56" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="1250" y="976" fill="#684496" font-size="16" font-weight="700">Routing layer</text>
    <rect x="285" y="940" width="160" height="60" rx="11" fill="#e8f2ff" stroke="#5a83b6" stroke-width="2"/>
    <text x="365" y="966" fill="#275685" font-size="16" font-weight="700">sum gradients</text>
    <text x="365" y="986" fill="#275685" font-size="13">expert + router</text>
    <rect x="995" y="940" width="160" height="60" rx="11" fill="#e8f2ff" stroke="#5a83b6" stroke-width="2"/>
    <text x="1075" y="966" fill="#275685" font-size="16" font-weight="700">sum gradients</text>
    <text x="1075" y="986" fill="#275685" font-size="13">expert + router</text>
    <rect x="280" y="1060" width="170" height="52" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="365" y="1092" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <rect x="990" y="1060" width="170" height="52" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="1075" y="1092" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <circle cx="365" cy="1185" r="40" fill="#e8f6eb" stroke="#2b8a57" stroke-width="2.5"/>
    <text x="365" y="1180" fill="#2b8a57" font-size="15" font-weight="700">token A</text>
    <text x="365" y="1199" fill="#2b8a57" font-size="15" font-weight="700">emb.</text>
    <circle cx="1075" cy="1185" r="40" fill="#fff0e6" stroke="#c8713e" stroke-width="2.5"/>
    <text x="1075" y="1180" fill="#a25122" font-size="15" font-weight="700">token B</text>
    <text x="1075" y="1199" fill="#a25122" font-size="15" font-weight="700">emb.</text>
  </g>
  <g fill="none" stroke="#7c4caf" stroke-width="2.5" marker-end="url(#purple-arrow)">
    <path d="M260 970H285"/>
    <path d="M1180 970H1155"/>
  </g>
  <g fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#gray-arrow)">
    <path d="M365 1000V1059"/>
    <path d="M1075 1000V1059"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M365 1112V1144" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M1075 1112V1144" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>

  <!-- Shared gradients are summed across ranks; expert gradients remain on owners. -->
  <text x="720" y="1270" text-anchor="middle" fill="#684496" font-family="system-ui,sans-serif" font-size="17" font-weight="700">B3 · SUM all-reduce projection + routing gradients</text>
  <path d="M637 1295H803" fill="none" stroke="#7c4caf" stroke-width="2.5" marker-start="url(#two-way)" marker-end="url(#two-way)"/>
</svg>
