<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1340" role="img" aria-labelledby="title desc">
  <title id="title">Backward pass on both ranks</title>
  <desc id="desc">The backward pass for the same four-expert example. Rank 0's token A sends an expert-output gradient to E2 on rank 1; rank 1's token B sends one to E1 on rank 0. Each expert accumulates parameter gradients on its owner, and the remote projected-input gradients return to the source ranks. Router and projection gradients are all-reduced.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526176" stroke-width="1.8"/></marker>
    <marker id="two-way" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c4caf" stroke-width="1.8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2b8a57" stroke-width="1.8"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#c8713e" stroke-width="1.8"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c4caf" stroke-width="1.8"/></marker>
    <symbol id="expert" viewBox="0 0 76 68">
      <g fill="none" stroke="#87a9a2" stroke-width="1.5"><path d="M8 17L37 9M8 17L37 34M8 17L37 59M8 51L37 9M8 51L37 34M8 51L37 59M37 9L68 17M37 9L68 51M37 34L68 17M37 34L68 51M37 59L68 17M37 59L68 51"/></g>
      <g fill="#c9ebe2" stroke="#21836e" stroke-width="1.8"><circle cx="8" cy="17" r="5"/><circle cx="8" cy="51" r="5"/><circle cx="37" cy="9" r="5"/><circle cx="37" cy="34" r="5"/><circle cx="37" cy="59" r="5"/><circle cx="68" cy="17" r="5"/><circle cx="68" cy="51" r="5"/></g>
    </symbol>
  </defs>

  <rect width="1440" height="1340" fill="#fff"/>
  <text x="40" y="46" fill="#202a3a" font-family="system-ui,sans-serif" font-size="29" font-weight="700">Backward pass · both ranks</text>
  <text x="40" y="78" fill="#5c6a7e" font-family="system-ui,sans-serif" font-size="17">Green follows A's gradient; orange follows B's. Each source receives the gradient for its own projected token.</text>
  <rect x="40" y="105" width="650" height="1195" rx="18" fill="#f7faff" stroke="#d6e1ee" stroke-width="2"/>
  <rect x="750" y="105" width="650" height="1195" rx="18" fill="#f8fbfa" stroke="#d7e7e2" stroke-width="2"/>
  <text x="68" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 0 · experts E0, E1</text>
  <text x="778" y="145" fill="#202a3a" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Rank 1 · experts E2, E3</text>

  <!-- The loss first differentiates each source's weighted combination. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="365" y="201" fill="#2b8a57" font-size="21" font-weight="700">∂L / ∂prediction A</text>
    <text x="1075" y="201" fill="#b35d2e" font-size="21" font-weight="700">∂L / ∂prediction B</text>
    <circle cx="365" cy="285" r="36" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/><text x="365" y="295" fill="#684496" font-size="28" font-weight="700">Σ</text>
    <circle cx="1075" cy="285" r="36" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/><text x="1075" y="295" fill="#684496" font-size="28" font-weight="700">Σ</text>
    <text x="365" y="349" fill="#526176" font-size="17">weighted sum backward</text>
    <text x="1075" y="349" fill="#526176" font-size="17">weighted sum backward</text>
  </g>
  <path d="M365 211V245M1075 211V245" fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#gray-arrow)"/>
  <text x="720" y="442" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">Counts and integer expert IDs have no backward path.</text>

  <!-- B1: one horizontal collective returns output gradients to expert owners. -->
  <path d="M365 365V529M1075 365V529" fill="none" stroke="#8995a5" stroke-width="2.5" stroke-dasharray="5 6"/>
  <path d="M340 538H1100" fill="none" stroke="#526176" stroke-width="4"/>
  <rect x="452" y="508" width="536" height="30" fill="#fff"/>
  <text x="720" y="530" text-anchor="middle" fill="#202a3a" font-family="system-ui,sans-serif" font-size="18" font-weight="700">B1 · send expert-output gradients to owners</text>
  <g fill="none" stroke-width="3" marker-end="url(#green-arrow)">
    <path d="M340 538V619" stroke="#2b8a57"/>
    <path d="M900 538V619" stroke="#2b8a57"/>
  </g>
  <g fill="none" stroke-width="3" marker-end="url(#orange-arrow)">
    <path d="M540 538V619" stroke="#c8713e"/>
    <path d="M1100 538V619" stroke="#c8713e"/>
  </g>

  <!-- All four experts backpropagate; parameter gradients stay with each owner. -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="280" y="670" fill="#176d5a" font-size="19" font-weight="700">E0</text>
    <text x="480" y="670" fill="#176d5a" font-size="19" font-weight="700">E1</text>
    <text x="962" y="670" fill="#176d5a" font-size="19" font-weight="700">E2</text>
    <text x="1162" y="670" fill="#176d5a" font-size="19" font-weight="700">E3</text>
    <use xlink:href="#expert" x="302" y="625" width="76" height="68"/>
    <use xlink:href="#expert" x="502" y="625" width="76" height="68"/>
    <use xlink:href="#expert" x="862" y="625" width="76" height="68"/>
    <use xlink:href="#expert" x="1062" y="625" width="76" height="68"/>
    <text x="340" y="734" fill="#176d5a" font-size="16">∂θ₀ stays on rank 0</text>
    <text x="540" y="760" fill="#176d5a" font-size="16">∂θ₁ stays on rank 0</text>
    <text x="900" y="734" fill="#176d5a" font-size="16">∂θ₂ stays on rank 1</text>
    <text x="1100" y="760" fill="#176d5a" font-size="16">∂θ₃ stays on rank 1</text>
  </g>

  <!-- B2: remote expert-input gradients cross back; local gradients stay on their source. -->
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M340 693V956H365V962" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M900 693V821H440V1000H404" stroke="#2b8a57" marker-end="url(#green-arrow)"/>
    <path d="M1100 693V956H1075V962" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
    <path d="M540 693V891H1000V1000H1036" stroke="#c8713e" marker-end="url(#orange-arrow)"/>
  </g>
  <text x="720" y="809" text-anchor="middle" fill="#2b8a57" font-family="system-ui,sans-serif" font-size="17" font-weight="700">B2 · E2 input gradient returns to A</text>
  <text x="770" y="879" text-anchor="middle" fill="#b35d2e" font-family="system-ui,sans-serif" font-size="17" font-weight="700">B2 · E1 input gradient returns to B</text>

  <!-- Gate-weight gradients backpropagate through the local routers. -->
  <path d="M329 285H105V925H120M1111 285H1335V925H1320" fill="none" stroke="#7c4caf" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#purple-arrow)"/>
  <text x="74" y="739" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(-90 74 739)">A's gate-weight gradient</text>
  <text x="1370" y="739" fill="#7c4caf" font-family="system-ui,sans-serif" font-size="15" transform="rotate(90 1370 739)">B's gate-weight gradient</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="120" y="902" width="140" height="46" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="190" y="930" fill="#684496" font-size="16" font-weight="700">Routing layer</text>
    <rect x="1180" y="902" width="140" height="46" rx="9" fill="#f0e8ff" stroke="#8666b7" stroke-width="2"/>
    <text x="1250" y="930" fill="#684496" font-size="16" font-weight="700">Routing layer</text>
    <text x="190" y="975" fill="#684496" font-size="15">backward</text>
    <text x="1250" y="975" fill="#684496" font-size="15">backward</text>
    <circle cx="365" cy="1000" r="36" fill="#e8f2ff" stroke="#5a83b6" stroke-width="2"/><text x="365" y="1009" fill="#275685" font-size="23" font-weight="700">Σh</text>
    <circle cx="1075" cy="1000" r="36" fill="#e8f2ff" stroke="#5a83b6" stroke-width="2"/><text x="1075" y="1009" fill="#275685" font-size="23" font-weight="700">Σh</text>
    <text x="365" y="1059" fill="#526176" font-size="16">sum expert + router gradients</text>
    <text x="1075" y="1059" fill="#526176" font-size="16">sum expert + router gradients</text>
    <rect x="280" y="1108" width="170" height="48" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="365" y="1138" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <rect x="990" y="1108" width="170" height="48" rx="9" fill="#e6efff" stroke="#5579bb" stroke-width="2"/>
    <text x="1075" y="1138" fill="#254b8b" font-size="18" font-weight="700">Projection layer</text>
    <text x="365" y="1195" fill="#2b8a57" font-size="18" font-weight="700">input gradient ∂L/∂A</text>
    <text x="1075" y="1195" fill="#b35d2e" font-size="18" font-weight="700">input gradient ∂L/∂B</text>
  </g>
  <g fill="none" stroke="#7c4caf" stroke-width="2.5" marker-end="url(#purple-arrow)"><path d="M260 925H275V1000H325M1180 925H1165V1000H1115"/></g>
  <g fill="none" stroke="#526176" stroke-width="2.5" marker-end="url(#gray-arrow)"><path d="M365 1036V1107M1075 1036V1107M365 1156V1177M1075 1156V1177"/></g>

  <!-- The only parameter gradients that cross ranks are the shared layers'. -->
  <text x="720" y="1251" text-anchor="middle" fill="#684496" font-family="system-ui,sans-serif" font-size="17" font-weight="700">B3 · SUM all-reduce router + projection parameter gradients</text>
  <path d="M637 1274H803" fill="none" stroke="#7c4caf" stroke-width="2.5" marker-start="url(#two-way)" marker-end="url(#two-way)"/>
</svg>
